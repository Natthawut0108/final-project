<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>คำนวณค่ารถเมล์</title>
<meta name="description" content="ประมาณค่ารถเมล์กรุงเทพฯ จากต้นทางไปปลายทาง">
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#1b2133;--muted:#667090;--line:#e2e6f0;--accent:#e8453c;--ok:#1f9d68}
@media (prefers-color-scheme:dark){:root{--bg:#12141c;--card:#1b1e29;--text:#eef0f7;--muted:#9aa2bd;--line:#2b3042}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans Thai','Sarabun',system-ui,sans-serif;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.card h2{font-size:1rem;margin:0 0 10px}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0}
input,button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px}
button{cursor:pointer;font-weight:600}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;width:100%}
button:disabled{opacity:.55;cursor:not-allowed}
.opts{list-style:none;margin:8px 0 0;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.opts button{width:100%;text-align:left;border:0;border-radius:0;font-weight:400;font-size:.9rem;border-bottom:1px solid var(--line)}
.opts li:last-child button{border-bottom:0}
.picked{color:var(--ok);font-size:.85rem;margin-top:6px}
.err{color:#d33;margin:8px 0}
.note{color:var(--muted);font-size:.85rem}
.fare{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.fare:last-child{border-bottom:0}
.fare b{font-size:1.5rem;color:var(--accent)}
.fare small{display:block;color:var(--muted)}
.swap{display:block;margin:-4px auto 12px}
</style>
</head>
<body>
<main class="wrap">
  <h1>🚌 คำนวณค่ารถเมล์</h1>
  <p class="sub">บอกสายรถเมล์ที่ต้องขึ้นและค่าโดยสารประมาณ จากที่หนึ่งไปอีกที่หนึ่ง (กรุงเทพฯ)</p>

  <div class="card" id="from">
    <h2>ต้นทาง</h2>
    <form class="row"><input placeholder="พิมพ์ชื่อสถานที่ เช่น อนุสาวรีย์ชัยสมรภูมิ" autocomplete="off"></form>
    <div class="err"></div><ul class="opts" hidden></ul><div class="picked"></div>
  </div>
  <button class="swap" id="swap" type="button" title="สลับต้นทาง/ปลายทาง">⇅ สลับ</button>
  <div class="card" id="to">
    <h2>ปลายทาง</h2>
    <form class="row"><input placeholder="พิมพ์ชื่อสถานที่ เช่น สยามพารากอน" autocomplete="off"></form>
    <div class="err"></div><ul class="opts" hidden></ul><div class="picked"></div>
  </div>

  <button class="primary" id="calc" disabled>คำนวณค่ารถเมล์</button>
  <div class="err" id="calcErr"></div>

  <section class="card" id="result" style="margin-top:16px" hidden></section>
</main>

<script>
// ===== อัตราค่าโดยสาร (ประมาณการ) — แก้ตัวเลขตรงนี้ได้ =====
// อ้างอิงข่าวปี 2568-2569: รถร้อน ขสมก. 8 บาทตลอดสาย, รถแอร์ 13-25 บาท, รถ EV 15-25 บาท
// ไม่มีตารางตามระยะทางอย่างเป็นทางการ จึงไล่ราคาตามกิโลเมตรแบบประมาณ
const BUS_TYPES = [
  { label: 'รถร้อน (ครีม-แดง)', min: 8,  max: 8,  note: '8 บาทตลอดสาย (กำลังทยอยเปลี่ยนเป็น EV)' },
  { label: 'รถแอร์ ขสมก.',      min: 13, max: 25, note: 'ประมาณ 13-25 บาทตามระยะทาง' },
  { label: 'รถ EV',             min: 15, max: 25, note: 'ประมาณ 15-25 บาทตามระยะทาง' },
];
const NEAR_KM = 4, FAR_KM = 24;
function estimateFare(t, km) {
  if (t.min === t.max) return t.min;
  const x = Math.min(Math.max((km - NEAR_KM) / (FAR_KM - NEAR_KM), 0), 1);
  return Math.round(t.min + x * (t.max - t.min));
}

// ===== ค้นหาสถานที่ (OpenStreetMap Nominatim) =====
const picked = { from: null, to: null };
function setupField(id) {
  const root = document.getElementById(id);
  const input = root.querySelector('input'), err = root.querySelector('.err');
  const list = root.querySelector('.opts'), mark = root.querySelector('.picked');
  let timer = null, ctrl = null, seq = 0;

  function render(items) {
    list.innerHTML = '';
    items.forEach((it) => {
      const li = document.createElement('li'), b = document.createElement('button');
      b.type = 'button'; b.textContent = (it.bus ? '🚏 ' : '📍 ') + it.name;
      b.onclick = () => {
        input.value = it.short || it.name; setPick(id, { name: it.name, lat: it.lat, lon: it.lon });
        list.hidden = true; err.textContent = '';
      };
      li.appendChild(b); list.appendChild(li);
    });
    list.hidden = items.length === 0;
  }
  // ค้นชื่อป้ายรถเมล์จากข้อมูลในเครื่อง (เร็ว ไม่ต้องใช้เน็ต)
  function localStops(q) {
    if (!BUS) return [];
    const seen = new Set(), out = [];
    for (const [, v] of Object.entries(BUS.stops)) {
      if (!v[2].includes(q) || seen.has(v[2])) continue;
      seen.add(v[2]);
      out.push({ bus: true, name: 'ป้ายรถเมล์ ' + v[2], short: v[2], lat: v[0], lon: v[1] });
      if (out.length >= 4) break;
    }
    return out;
  }
  async function search() {
    const q = input.value.trim();
    err.textContent = '';
    if (q.length < 2) { list.hidden = true; return; }
    const my = ++seq;
    const local = localStops(q);
    if (local.length) render(local); // แสดงผลในเครื่องก่อนทันที
    if (ctrl) ctrl.abort();
    ctrl = new AbortController();
    try {
      const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=th&accept-language=th&q=' + encodeURIComponent(q), { signal: ctrl.signal });
      if (!r.ok) throw new Error();
      const data = await r.json();
      if (my !== seq) return;
      const online = data.map((d) => ({ name: d.display_name, short: d.name || d.display_name.split(',')[0], lat: +d.lat, lon: +d.lon }));
      const all = local.concat(online);
      if (!all.length) err.textContent = 'ไม่พบสถานที่ ลองพิมพ์ชื่อให้เฉพาะเจาะจงขึ้น';
      render(all);
    } catch (e) {
      if (e.name === 'AbortError' || my !== seq) return;
      if (!local.length) err.textContent = 'ค้นหาสถานที่ไม่สำเร็จ ลองใหม่อีกครั้ง';
    }
  }
  input.addEventListener('input', () => {
    if (picked[id]) setPick(id, null); // แก้ข้อความ = ยกเลิกที่เลือกไว้
    clearTimeout(timer);
    timer = setTimeout(search, 500);
  });
  root.querySelector('form').addEventListener('submit', (e) => { e.preventDefault(); clearTimeout(timer); search(); });
  root._mark = mark; root._input = input;
}
function setPick(id, p) {
  picked[id] = p;
  const root = document.getElementById(id);
  root._mark.textContent = p ? 'เลือกแล้ว: ' + p.name : '';
  document.getElementById('calc').disabled = !(picked.from && picked.to);
}
setupField('from'); setupField('to');
document.getElementById('swap').onclick = () => {
  const a = picked.from, b = picked.to;
  const ia = document.querySelector('#from input'), ib = document.querySelector('#to input');
  [ia.value, ib.value] = [ib.value, ia.value];
  setPick('from', b); setPick('to', a);
};

// ===== ข้อมูลสายรถเมล์ ขสมก. (bus-data.json) =====
let BUS = null;
const busReady = fetch('bus-data.json').then((r) => r.json()).then((d) => { BUS = d; }).catch(() => {});

const WALK_MAX = 800;      // เดินไปป้ายได้ไม่เกิน (เมตร)
const TRANSFER_MAX = 300;  // ป้ายต่อรถห่างกันไม่เกิน (เมตร)
function hav(a, b) { // เมตร
  const R = 6371000, rad = (x) => x * Math.PI / 180;
  const dLat = rad(b[0] - a[0]), dLon = rad(b[1] - a[1]);
  const h = Math.sin(dLat/2)**2 + Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const pos = (id) => BUS.stops[id];
function rideM(stops, i, j) { let m = 0; for (let k = i; k < j; k++) m += hav(pos(stops[k]), pos(stops[k + 1])); return m; }

// หาป้ายที่ใกล้จุดที่สุดในแต่ละสาย (ภายในระยะเดิน)
function nearestOnRoutes(pt) {
  const out = [];
  BUS.routes.forEach((r, ri) => {
    let best = -1, bd = WALK_MAX + 1;
    r.s.forEach((id, k) => { const d = hav(pt, pos(id)); if (d < bd) { bd = d; best = k; } });
    if (best >= 0) out.push({ ri, k: best, walk: bd });
  });
  return out;
}

function findRoutes(from, to) {
  const A = nearestOnRoutes([from.lat, from.lon]);
  const B = nearestOnRoutes([to.lat, to.lon]);
  const bMap = new Map(B.map((x) => [x.ri, x]));
  const options = [];
  // เส้นทางตรง
  A.forEach((a) => {
    const b = bMap.get(a.ri);
    if (!b || b.k <= a.k) return;
    const r = BUS.routes[a.ri];
    const m = rideM(r.s, a.k, b.k);
    options.push({ legs: [{ r, from: a.k, to: b.k, m }], walk: a.walk + b.walk, cost: (a.walk + b.walk) / 80 + (b.k - a.k) * 1.8 });
  });
  const direct = dedupe(options).sort((x, y) => x.cost - y.cost).slice(0, 4);
  if (direct.length) return { type: 'direct', options: direct };

  // ต่อรถ 1 ครั้ง
  const topA = A.sort((x, y) => x.walk - y.walk).slice(0, 25);
  const topB = B.sort((x, y) => x.walk - y.walk).slice(0, 25);
  const tr = [];
  topA.forEach((a) => {
    const ra = BUS.routes[a.ri];
    topB.forEach((b) => {
      const rb = BUS.routes[b.ri];
      if (ra.n === rb.n) return;
      let best = null;
      for (let x = a.k + 1; x < ra.s.length; x++) {
        const px = pos(ra.s[x]);
        for (let y = 0; y < b.k; y++) {
          const d = hav(px, pos(rb.s[y]));
          if (d > TRANSFER_MAX) continue;
          const cost = (x - a.k) * 1.8 + (b.k - y) * 1.8 + d / 80;
          if (!best || cost < best.cost) best = { x, y, d, cost };
        }
      }
      if (best) tr.push({
        legs: [
          { r: ra, from: a.k, to: best.x, m: rideM(ra.s, a.k, best.x) },
          { r: rb, from: best.y, to: b.k, m: rideM(rb.s, best.y, b.k) },
        ],
        walk: a.walk + b.walk + best.d,
        cost: (a.walk + b.walk) / 80 + best.cost + 15,
      });
    });
  });
  const opts = dedupe(tr).sort((x, y) => x.cost - y.cost).slice(0, 3);
  return { type: opts.length ? 'transfer' : 'none', options: opts };
}
function dedupe(list) {
  const seen = new Set();
  return list.filter((o) => { const k = o.legs.map((l) => l.r.n).join('>'); if (seen.has(k)) return false; seen.add(k); return true; });
}

// ===== หาระยะทาง (OSRM) / สำรองด้วยเส้นตรง x 1.3 =====
const esc = (t) => String(t).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
function legHtml(l, label) {
  const stopsN = l.to - l.from;
  return `<div>${label}ขึ้น <b>สาย ${esc(l.r.n)}</b> (ไปทาง ${esc(l.r.h)})<br>
    <small>ขึ้นที่ ${esc(pos(l.r.s[l.from])[2])} → ลงที่ ${esc(pos(l.r.s[l.to])[2])} · ${stopsN} ป้าย · ${(l.m / 1000).toFixed(1)} กม.</small></div>`;
}
document.getElementById('calc').onclick = async () => {
  const btn = document.getElementById('calc'), errBox = document.getElementById('calcErr'), out = document.getElementById('result');
  errBox.textContent = ''; out.hidden = true; btn.disabled = true; btn.textContent = 'กำลังคำนวณ…';
  const a = picked.from, b = picked.to;
  let km, minutes, estimated = false;
  try {
    const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=false`);
    const d = await r.json();
    const route = d.routes && d.routes[0];
    if (!route) throw new Error();
    km = route.distance / 1000; minutes = route.duration / 60;
  } catch {
    km = hav([a.lat, a.lon], [b.lat, b.lon]) / 1000 * 1.3; minutes = km / 15 * 60; estimated = true;
  }
  await busReady;
  let html = '';
  let legsForFare = null;
  if (BUS) {
    const res = findRoutes(a, b);
    if (res.type === 'none') {
      html += `<h2>สายรถเมล์ที่ควรขึ้น</h2><p class="note">ไม่พบสายตรงหรือต่อรถ 1 ครั้งที่ป้ายอยู่ห่างจากต้นทาง/ปลายทางไม่เกิน ${WALK_MAX} เมตร ลองเลือกสถานที่ที่อยู่ใกล้ถนนสายหลักมากขึ้น</p>`;
    } else {
      legsForFare = res.options[0].legs;
      html += `<h2>สายรถเมล์ที่ควรขึ้น${res.type === 'transfer' ? ' (ต้องต่อรถ 1 ครั้ง)' : ''}</h2>`;
      html += res.options.map((o, idx) => {
        const legs = o.legs.map((l, i) => legHtml(l, o.legs.length > 1 ? (i === 0 ? 'ต่อที่ 1: ' : 'ต่อที่ 2: ') : '')).join('');
        return `<div class="fare" style="align-items:flex-start"><div>${idx === 0 ? '⭐ แนะนำ<br>' : ''}${legs}<small>เดินรวมประมาณ ${Math.round(o.walk)} เมตร (ไปป้ายต้นทาง/จากป้ายปลายทาง${o.legs.length > 1 ? '/ระหว่างต่อรถ' : ''})</small></div></div>`;
      }).join('');
    }
  } else {
    html += `<p class="note">โหลดข้อมูลสายรถเมล์ไม่สำเร็จ (bus-data.json) จึงแสดงเฉพาะค่าโดยสารประมาณ</p>`;
  }
  const fareOf = (t) => legsForFare ? legsForFare.reduce((s, l) => s + estimateFare(t, l.m / 1000), 0) : estimateFare(t, km);
  html += `<h2 style="margin-top:16px">ค่าโดยสารประมาณ${legsForFare ? ' (ตามสายที่แนะนำ)' : ''} · ถนนระยะ ${km.toFixed(1)} กม. ~${Math.round(minutes)} นาทีโดยรถยนต์</h2>` +
    BUS_TYPES.map((t) => `<div class="fare"><div>${t.label}<small>${t.note}</small></div><b>${fareOf(t)} ฿</b></div>`).join('') +
    `<p class="note">${BUS ? esc(BUS.asof) + ' อาจไม่ตรงกับสาย/ป้ายปัจจุบัน ' : ''}ราคาเป็นค่าประมาณตามระยะทาง ไม่ใช่ราคาจริงของแต่ละสาย และรถแต่ละสายอาจเป็นรถร้อนหรือรถแอร์ต่างกัน${estimated ? ' (หาเส้นทางถนนไม่ได้ จึงประมาณระยะจากเส้นตรง)' : ''}</p>`;
  out.innerHTML = html;
  out.hidden = false; btn.disabled = false; btn.textContent = 'คำนวณค่ารถเมล์';
};
</script>
</body>
</html>
